<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- Google Analytics -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>亞馬遜台灣第三方服務商網絡指南</title>
  <!-- Favicon — Amazon smile on Smile Orange (TWGS brand) -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preload" href="Banner/banner1.webp" as="image" type="image/webp">
  <style>
    /* Traditional-Chinese brand typeface — self-hosted so it loads behind the
       Great Firewall / Protozoa where fonts.googleapis.com is blocked. System
       fonts (PingFang TC / JhengHei) act as the swap fallback until it arrives. */
    @font-face{font-family:'Noto Sans TC';src:url('fonts/NotoSansTC-Regular.ttf') format('truetype');font-weight:400;font-display:swap;}
    @font-face{font-family:'Noto Sans TC';src:url('fonts/NotoSansTC-Medium.ttf') format('truetype');font-weight:500;font-display:swap;}
    @font-face{font-family:'Noto Sans TC';src:url('fonts/NotoSansTC-Bold.ttf') format('truetype');font-weight:700;font-display:swap;}
    :root{
      /* TWGS Visual Identity (2025/11) — the only 5 brand colours allowed */
      --off-white:#f5f3ef;--white:#ffffff;--squid-ink:#161d26;
      --smile-orange:#ff6200;--smile-orange-text:#f55600;
      /* Functional neutrals (body-text greys / hairlines — not brand hues) */
      --text-primary:#161d26;--text-secondary:#4a5568;--text-light:#8a919a;--border:#e2e4e7;
      /* Compatibility aliases: existing class rules reference these names.
         Every dark now maps to Squid Ink; every orange to Smile Orange. */
      --amz-navy:#161d26;--amz-navy-deep:#161d26;--amz-orange:#ff6200;--amz-orange-hover:#f55600;
      --amz-orange-light:#fff3eb;/* pale screen of Smile Orange, used for icon/hover fills */
      --bg:#ffffff;--bg-warm:#f5f3ef;--bg-card:#ffffff;--bg-section:#f5f3ef;
      --card-shadow:0 2px 8px 0 rgba(22,29,38,.06);
      --radius-sm:8px;--radius-md:12px;--radius-lg:20px;
    }
    *{box-sizing:border-box;}
    body{background:var(--bg);font-family:'Amazon Ember','Noto Sans TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif;color:var(--text-primary);margin:0;-webkit-font-smoothing:antialiased;}

    /* NAV */
    .headbar{background:var(--amz-navy-deep);color:#fff;padding:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(22,30,44,.18);}
    .headbar-inner{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.5rem 0;min-height:52px;}
    .brand-logo{display:flex;align-items:center;cursor:pointer;padding:.3rem .6rem;border:none;border-radius:var(--radius-sm);flex-shrink:0;}
    .brand-logo:hover{opacity:.8;}
    .brand-logo img{height:26px;}
    .site-select-wrapper{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:rgba(255,255,255,.7);white-space:nowrap;padding:.3rem .6rem;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;}
    .site-select-wrapper:hover{border-color:rgba(255,255,255,.4);color:#fff;}
    .site-select-control{background:transparent;color:#fff;border:none;font-size:.8rem;font-weight:700;cursor:pointer;padding:0;}
    .site-select-control option{background:var(--amz-navy-deep);color:#fff;}
    .site-select-control:focus{outline:none;}
    .search-form{flex:1 1 auto;max-width:560px;}
    .search-box{background:#fff;border-radius:var(--radius-md);overflow:hidden;display:flex;align-items:stretch;border:2px solid var(--amz-orange);height:42px;transition:box-shadow .2s;}
    .search-box:focus-within{box-shadow:0 0 0 3px rgba(255,98,0,.2);}
    .search-box input{border:0;padding:0 .85rem;flex:1;min-width:80px;font-size:.88rem;color:var(--text-primary);}
    .search-box input:focus{outline:none;}
    .search-box .btn-search{background:var(--amz-orange);color:#fff;border:0;width:48px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;transition:background .15s;}
    .search-box .btn-search:hover{background:var(--amz-orange-hover);}
    .nav-right-link{color:rgba(255,255,255,.85);text-decoration:none;font-size:.78rem;padding:.3rem .7rem;border:1px solid transparent;border-radius:var(--radius-sm);display:flex;align-items:center;gap:.4rem;white-space:nowrap;transition:all .15s;}
    .nav-right-link:hover{border-color:rgba(255,255,255,.4);color:#fff;}
    @media(max-width:768px){.nav-right-group{display:none!important;}.search-form{max-width:none;}}

    /* HERO */
    .hero-banner{background:var(--amz-orange);padding:0;position:relative;overflow:hidden;}
    .hero-banner-inner{max-width:1200px;margin:0 auto;padding:1.5rem 1rem;}
    .hero-carousel{border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 12px 40px rgba(255,98,0,.15);background:#fff;}
    .carousel-indicators{margin-bottom:.75rem;}
    .carousel-indicators [data-bs-target]{width:8px;height:8px;border-radius:999px;opacity:.3;transition:all .3s;}
    .carousel-indicators .active{background-color:var(--amz-orange);opacity:1;width:24px;}
    .carousel-control-prev,.carousel-control-next{width:40px;height:40px;top:50%;transform:translateY(-50%);bottom:auto;background:rgba(0,0,0,.45);border-radius:999px;opacity:1;margin:0 .5rem;transition:background .2s;}
    .carousel-control-prev:hover,.carousel-control-next:hover{background:rgba(0,0,0,.7);}
    .carousel-control-prev-icon,.carousel-control-next-icon{width:18px;height:18px;filter:brightness(0) invert(1);}
    @media(max-width:576px){.hero-carousel-content{padding:1.5rem;}}
    /* SSP Award slide (winners rendered from prov_data.js in renderAwardSlide) */
    .award-slide{text-decoration:none;display:block;}
    .award-slide-inner{aspect-ratio:2400/490;max-height:250px;background:radial-gradient(ellipse at 85% 0%,rgba(255,98,0,.35),transparent 55%),radial-gradient(ellipse at 10% 100%,rgba(255,98,0,.18),transparent 50%),var(--squid-ink);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(.25rem,1.2vw,.6rem);padding:1rem;overflow:hidden;text-align:center;}
    .award-pill{background:rgba(255,98,0,.15);border:1px solid rgba(255,98,0,.45);border-radius:999px;padding:clamp(.15rem,1vw,.4rem) clamp(.6rem,3vw,1.4rem);font-size:clamp(.55rem,1.8vw,.8rem);color:var(--smile-orange);font-weight:700;letter-spacing:.5px;white-space:nowrap;}
    .award-title{color:#fff;font-size:clamp(.95rem,3.6vw,2rem);font-weight:800;line-height:1.2;}
    .award-title span{color:var(--smile-orange);}
    .award-winners{display:flex;flex-direction:column;align-items:center;gap:clamp(.25rem,.8vw,.45rem);}
    .award-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(.25rem,1vw,.5rem);}
    .award-row-name{color:rgba(255,255,255,.85);font-size:clamp(.6rem,1.6vw,.85rem);font-weight:700;margin-right:.25rem;}
    .award-note{background:var(--bg-warm);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.65rem .9rem;margin:0 0 .9rem;font-size:.85rem;line-height:1.6;color:var(--text-secondary);}
    .award-note-title{font-weight:700;color:var(--text-primary);margin-bottom:.15rem;}
    .award-chip{background:#fff;color:var(--squid-ink);border:0;border-radius:999px;padding:clamp(.1rem,.6vw,.3rem) clamp(.5rem,1.6vw,.9rem);font-size:clamp(.6rem,1.6vw,.85rem);font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .15s,box-shadow .15s;}
    .award-chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,98,0,.4);}
    .award-sub{color:rgba(255,255,255,.75);font-size:clamp(.6rem,2vw,1rem);line-height:1.2;}
    @media(max-width:576px){.award-winners,.award-sub{display:none;}}
    /* 焦點消息 marquee (mirrors the PMM portal ticker); items from pmm_news.js */
    .ticker{background:var(--squid-ink);color:#fff;overflow:hidden;border-top:1px solid #2a3340;}
    .ticker-in{display:flex;align-items:stretch;max-width:1200px;margin:0 auto;padding-right:1rem;}
    .ticker-label{flex:none;position:relative;display:flex;align-items:center;gap:.35rem;background:var(--smile-orange);color:var(--squid-ink);font-weight:700;font-size:.76rem;padding:.32rem .9rem .32rem 1rem;white-space:nowrap;z-index:2;}
    .ticker-label svg{width:12px;height:12px;}
    .ticker-view{overflow:hidden;flex:1;padding:0 .5rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5rem,#000 calc(100% - 2.5rem),transparent);mask-image:linear-gradient(90deg,transparent,#000 2.5rem,#000 calc(100% - 2.5rem),transparent);}
    .ticker-track{display:flex;gap:2.5rem;white-space:nowrap;width:max-content;animation:tickerScroll 200s linear infinite;will-change:transform;}
    .ticker-view:hover .ticker-track,.ticker-view:focus-within .ticker-track{animation-play-state:paused;}
    .ticker-item{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:400;padding:.32rem 0;color:rgba(255,255,255,.72);text-decoration:none;}
    .ticker-item:hover{color:#fff;text-decoration:underline;}
    .ticker-item .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.4);flex:none;}
    .ticker-item .tk-date{color:rgba(255,255,255,.42);font-size:.7rem;font-weight:400;}
    @keyframes tickerScroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
    @media(prefers-reduced-motion:reduce){.ticker-track{animation:none;}.ticker-view{overflow-x:auto;}}
    @media(max-width:576px){.ticker-in{padding-right:0;}.ticker-label{font-size:.7rem;padding:.3rem .6rem;}.ticker-item{font-size:.74rem;}.ticker-track{gap:1.8rem;animation-duration:260s;}}
    /* PMM news-portal slide: light variant of the award slide */
    .news-slide-inner{aspect-ratio:2400/490;max-height:250px;background:radial-gradient(ellipse at 90% 10%,rgba(255,98,0,.16),transparent 55%),radial-gradient(ellipse at 5% 95%,rgba(0,168,225,.10),transparent 50%),var(--off-white);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(.25rem,1.2vw,.6rem);padding:1rem;overflow:hidden;text-align:center;}
    .news-pill{background:#fff;border:1px solid rgba(255,98,0,.45);border-radius:999px;padding:clamp(.15rem,1vw,.4rem) clamp(.6rem,3vw,1.4rem);font-size:clamp(.55rem,1.8vw,.8rem);color:var(--smile-orange-text);font-weight:700;letter-spacing:.5px;white-space:nowrap;}
    .news-title{color:var(--squid-ink);font-size:clamp(.95rem,3.6vw,2rem);font-weight:800;line-height:1.2;}
    .news-title span{color:var(--smile-orange);}
    .news-sub{color:var(--text-light);font-size:clamp(.6rem,2vw,1rem);line-height:1.2;}
    @media(max-width:576px){.news-sub{display:none;}.award-slide-inner,.news-slide-inner{padding:.5rem 1rem 1.9rem;}.carousel-indicators{margin-bottom:0;}}
    .carousel-indicators [data-bs-target]:not(.active){background-color:#8a8f98;opacity:.6;}

    /* KOL education slide (links to 廣告推廣協助 › KOL網紅行銷) */
    .kol-slide-inner{aspect-ratio:2400/490;max-height:250px;background:radial-gradient(ellipse at 92% 50%,rgba(255,98,0,.55),transparent 55%),linear-gradient(100deg,var(--squid-ink) 0%,var(--squid-ink) 55%,#3a2416 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(.25rem,1.2vw,.6rem);padding:1rem;overflow:hidden;text-align:center;position:relative;}
    .kol-pill{background:var(--smile-orange);border-radius:999px;padding:clamp(.15rem,1vw,.4rem) clamp(.6rem,3vw,1.4rem);font-size:clamp(.55rem,1.8vw,.8rem);color:#fff;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
    .kol-title{color:#fff;font-size:clamp(.95rem,3.6vw,2rem);font-weight:800;line-height:1.2;}
    .kol-title span{color:var(--smile-orange);}
    .kol-sub{color:rgba(255,255,255,.75);font-size:clamp(.6rem,2vw,1rem);line-height:1.2;}
    .kol-tags{display:flex;gap:clamp(.25rem,1vw,.5rem);flex-wrap:wrap;justify-content:center;}
    .kol-tags span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;font-size:clamp(.55rem,1.5vw,.8rem);padding:clamp(.1rem,.5vw,.25rem) clamp(.5rem,1.5vw,.9rem);}
    .kol-icons{position:absolute;left:4%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.6rem;font-size:clamp(1rem,3vw,2rem);color:rgba(255,255,255,.12);}
    @media(max-width:576px){.kol-tags,.kol-icons{display:none;}.kol-slide-inner{padding:.5rem 1rem 1.9rem;}}
    /* KOL 網紅行銷 sub-type intro block (rendered by renderSubIntro) */
  .kol101{background:var(--off-white);border:1px solid var(--border);border-left:4px solid var(--smile-orange);border-radius:var(--radius-md);padding:.85rem 1rem .75rem;margin-bottom:1rem;}
  .k-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;}
  .k-title{font-size:1.02rem;font-weight:800;margin:0;}
  .k-title span{color:var(--smile-orange);}
  .k-lead{font-size:.78rem;color:var(--text-secondary);margin:.1rem 0 0;}
  .k-toggle{background:none;border:1px solid var(--border);border-radius:999px;font-size:.72rem;color:var(--text-secondary);padding:.2rem .65rem;white-space:nowrap;}
  .k-toggle:hover{border-color:var(--smile-orange);color:var(--smile-orange-text);}
  .kol101.collapsed .k-body{display:none;}
  .k-body{display:grid;grid-template-columns:1.15fr 1.1fr 1fr;gap:.5rem;margin-top:.65rem;}
  .k-col{background:#fff;border-radius:var(--radius-sm);padding:.6rem .7rem;font-size:.76rem;line-height:1.45;color:var(--text-secondary);}
  .k-col h4{font-size:.84rem;font-weight:700;color:var(--text-primary);margin:0 0 .35rem;display:flex;align-items:center;gap:.35rem;}
  .k-col h4 i{color:var(--smile-orange);}
  .k-col ul{margin:0;padding-left:1rem;}
  .k-col li{margin-bottom:.2rem;}
  .k-col b{color:var(--text-primary);}
  .kol101 code.q{background:var(--amz-orange-light);color:var(--smile-orange-text);border-radius:4px;padding:0 .3rem;font-size:.72rem;white-space:nowrap;}
  .kol101 .chips-label{font-size:.7rem;color:var(--text-light);margin-top:.45rem;}
  .kol101 .chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.2rem;}
  .kol101 .chips a{border:1px solid var(--smile-orange);border-radius:999px;padding:.05rem .5rem;font-size:.7rem;color:var(--smile-orange-text);text-decoration:none;font-weight:600;}
  .kol101 .chips a:hover{background:var(--smile-orange);color:#fff;}
  .kol101 .chips a i{font-size:.6rem;}
  .k-col a.hl{font-weight:700;color:var(--text-primary);text-decoration:underline;text-decoration-color:var(--smile-orange);text-underline-offset:2px;}
  .k-col a.hl:hover{color:var(--smile-orange-text);}
  .kol101 .chips span{border:1px solid var(--border);border-radius:999px;padding:.05rem .5rem;font-size:.7rem;color:var(--text-primary);}
  .kol101 .tier{display:flex;gap:.45rem;margin-bottom:.3rem;}
  .kol101 .tier .tg{flex:0 0 3.6em;text-align:center;background:var(--squid-ink);color:#fff;border-radius:4px;font-size:.68rem;font-weight:700;padding:.1rem 0;height:fit-content;}
  .kol101 .tier .tg.o{background:var(--smile-orange);}
  .kol101 .tier .tg.g{background:#8a919a;}
  .k-foot{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;font-size:.75rem;color:var(--text-secondary);padding-top:.15rem;}
  .k-foot i{color:var(--smile-orange);}
  .k-cta2{grid-column:1/-1;justify-self:end;display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;color:var(--text-secondary);text-decoration:none;padding:.1rem 0;}
  .k-cta2 i{color:var(--smile-orange);}
  .k-cta2 b{color:var(--smile-orange-text);font-weight:700;}
  .k-cta2:hover b{text-decoration:underline;text-underline-offset:2px;}
  .k-tip{font-size:.72rem;color:var(--text-secondary);background:var(--amz-orange-light);border-radius:4px;padding:.3rem .45rem;margin-top:.4rem;line-height:1.4;}
  .k-tip i{color:var(--smile-orange);}
  @media(max-width:768px){.k-body{grid-template-columns:1fr;}}
  .k-read{grid-column:1/-1;background:#fff;border-radius:var(--radius-sm);padding:.55rem .7rem .65rem;}
  .k-read-h{font-size:.84rem;font-weight:700;color:var(--text-primary);margin-bottom:.45rem;display:flex;align-items:center;gap:.35rem;}
  .k-read-h i{color:var(--smile-orange);}
  .k-read-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;max-width:80%;}
  .k-read-list a{display:flex;flex-direction:column;gap:.25rem;text-decoration:none;color:var(--text-primary);min-width:0;}
  .k-read-list .kr-img{position:relative;display:block;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--off-white);}
  .k-read-list .kr-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
  .k-read-list a:hover .kr-img img{transform:scale(1.04);}
  .k-read-list .kr-play{position:absolute;left:.4rem;bottom:.3rem;font-size:1.35rem;line-height:1;color:#ff0033;background:#fff;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.3);}
  .k-read-list .kr-t{font-size:.78rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .k-read-list a:hover .kr-t{color:var(--smile-orange-text);}
  .k-read-list .kr-s{font-size:.68rem;color:var(--text-light);}
  @media(max-width:768px){.k-read-list{grid-template-columns:1fr 1fr;max-width:none;}}
  @media(max-width:480px){.k-read-list{grid-template-columns:1fr;}}
    /* CATEGORY GRID */
    .section-sub{color:var(--text-secondary);font-size:.88rem;margin-top:.25rem;}
    .cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2rem 1.5rem;margin-top:2rem;padding:0 1rem;}
    @media(max-width:768px){.cat-grid{grid-template-columns:repeat(3,1fr);gap:1.5rem .75rem;}}
    @media(max-width:480px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
    .cat-card{background:none;border:none;padding:1rem .5rem;cursor:pointer;transition:all .25s ease;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;border-radius:var(--radius-lg);}
    .cat-card:hover{transform:translateY(-6px);background:var(--bg-card);box-shadow:0 12px 32px rgba(22,30,44,.1);}
    .cat-card:hover .cat-icon{background:var(--amz-orange);color:#fff;box-shadow:0 8px 24px rgba(255,98,0,.3);transform:scale(1.12);}
    .cat-card:hover .cat-name{color:var(--amz-orange);}
    .cat-icon{width:64px;height:64px;border-radius:999px;background:var(--amz-orange-light);color:var(--amz-orange);display:flex;align-items:center;justify-content:center;font-size:1.7rem;transition:all .3s ease;box-shadow:0 3px 12px rgba(255,98,0,.1);}
    .cat-name{font-weight:700;font-size:1.26rem;margin-top:.2rem;color:var(--text-primary);transition:color .2s;}
    .cat-desc{color:var(--text-light);font-size:.8rem;line-height:1.4;}

    /* DOMAIN TAB BAR */
    .domain-bar{background:var(--amz-navy);position:sticky;top:52px;z-index:90;box-shadow:0 2px 8px rgba(22,30,44,.12);}
    .domain-bar-inner{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
    .domain-bar-inner::-webkit-scrollbar{display:none;}
    .domain-tab{flex:0 0 auto;padding:.65rem 1.3rem;font-size:.9rem;font-weight:500;color:rgba(255,255,255,.65);cursor:pointer;white-space:nowrap;transition:all .2s;background:none;border:0;border-bottom:2.5px solid transparent;line-height:1.3;}
    .domain-tab:hover{color:#fff;background:rgba(255,255,255,.05);border-bottom-color:rgba(255,255,255,.25);}
    .domain-tab.active{color:#fff;background:rgba(255,98,0,.12);border-bottom-color:var(--amz-orange);font-weight:700;}

    /* SUB-TYPE PILLS */
    #subTypeNav{gap:.4rem;}
    #subTypeNav .nav-link{font-size:1.02rem;border-radius:var(--radius-sm);padding:.5rem .8rem;color:var(--text-secondary);background:var(--bg-card);border:1px solid var(--border);transition:all .2s;font-weight:500;text-align:left;white-space:normal;line-height:1.3;}

function matchSite(p){

function initials(n){ return n.replace(/[\(（].*?[\)）]/g,"").trim().slice(0,2); }
// HTML-escape any provider-sourced string before it enters innerHTML. The data
// comes from a Google Sheet that the whole team can edit, so a stray "<" or a
// crafted <script>/<img onerror> cell must render as text, never execute.
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmt(text){
  if(!text) return "";
  // Escape first, THEN convert newlines and auto-link — so untrusted text can
  // never inject markup, only the URLs we ourselves build become real <a> tags.
  let s = esc(text).replace(/\n/g,"<br>");
  // Auto-link URLs (operating on already-escaped text)
  s = s.replace(/(https?:\/\/[^\s<,，、）)]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;">$1</a>');
  return s;
}
// Clean a contact field for display: hide it entirely when the whole cell is
// just a placeholder ("未提供") or a leftover spreadsheet error (#ERROR! etc.),
// and strip an error token that is glued onto an otherwise-valid value. Normal
// punctuation inside real values (commas, 、 between numbers) is left untouched.
function cleanContact(v){
  if(!v) return "";
  let s = String(v).trim();
  if(s==="未提供") return "";
  if(/^#(?:ERROR!|REF!|N\/A|NAME\?|VALUE!|DIV\/0!|NULL!|NUM!)$/i.test(s)) return "";        // whole cell is an error
  s = s.replace(/[/、,，]\s*#(?:ERROR!|REF!|N\/A|NAME\?|VALUE!|DIV\/0!|NULL!|NUM!)/ig,"");   // "x / #ERROR!" -> "x"
  s = s.replace(/#(?:ERROR!|REF!|N\/A|NAME\?|VALUE!|DIV\/0!|NULL!|NUM!)\s*[/、,，]\s*/ig,""); // "#ERROR! / x" -> "x"
  return s.trim();
}
// Render the website field, tolerating an optional "label: url" prefix (e.g. "預約寄件: https://...")
function websiteLink(w){
  w = cleanContact(w);
  if(!w) return "";
  const m = w.match(/^(.*?)[:：]?\s*(https?:\/\/\S+)/);
  const label = m && m[1].trim() ? m[1].trim()+"：" : "";
  const url = m ? m[2] : (w.startsWith("http")?w:"https://"+w);
  return `<p class="mb-1"><i class="bi bi-globe me-2"></i>${esc(label)}<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;">${esc(url)}</a></p>`;
}

}

/* ===== History / deep-link navigation ===== */
let suppressPush=false;
function stateHash(s){
  // Home uses a clean URL (no #) so the shared landing-page link stays tidy
  if(!s||s.view==="home") return location.pathname+location.search;
  if(s.view==="search") return "#/s/"+encodeURIComponent(s.q||"");
  if(s.view==="category") return "#/c/"+encodeURIComponent(s.cat)+(s.sub?"/"+encodeURIComponent(s.sub):"");
  if(s.view==="detail") return "#/p/"+encodeURIComponent(s.name);
  return location.pathname+location.search;
}
function pushNav(s){
  if(suppressPush) return;
  s.depth=((history.state&&history.state.depth)||0)+1;
  history.pushState(s,"",stateHash(s));
}
function parseHash(){
  const parts=(location.hash||"").replace(/^#\/?/,"").split("/").filter(Boolean).map(decodeURIComponent);
  if(!parts.length) return {view:"home"};
  if(parts[0]==="s") return {view:"search",q:parts[1]||""};
  if(parts[0]==="c") return {view:"category",cat:parts[1],sub:parts[2]||null};
  if(parts[0]==="p") return {view:"detail",name:parts[1]};
  return {view:"home"};
}
function selectSub(sub){
  const nav=$("subTypeNav"); if(!nav) return;
  const btn=[...nav.querySelectorAll(".nav-link")].find(b=>b.textContent===sub);
  if(btn) btn.click();
}
function renderState(s){
  suppressPush=true;
  try{
    if(!s||s.view==="home"){ goHome(); }
    else if(s.view==="search"){ $("searchInput").value=s.q||""; runSearch(); }
    else if(s.view==="category"){
      if(!categoryMap[s.cat]){ goHome(); return; }
      openCategory(s.cat);
      if(s.sub) selectSub(s.sub);
    }
    else if(s.view==="detail"){
      if(s.cat&&categoryMap[s.cat]){ curCat=categoryMap[s.cat]; curSub=s.sub||null; }
      if(!providerMap[s.name]){ goHome(); return; }
      openDetail(s.name);
    }
    else goHome();
  } finally { suppressPush=false; }
}

/* ===== Provider matching logic ===== */
function providerMatchesCat(p, cat){
  // Check if provider's tags match this category
  if(p.tags.includes(cat.name)) return true;
  // Check if provider's svc keys match
  if(p.svc && p.svc[cat.name]) return true;
  // Check if any sub-type matches
  for(const sub of cat.subTypes){
    if(providerMatchesSub(p, sub)) return true;
  }
  return false;
}

function providerMatchesSub(p, sub){
  // If sub-type is region-restricted and current site doesn't match, never match
  if(!subAllowedForSite(sub)) return false;
  // Check in svc sub fields - only match within the current category's svc
  if(p.svc && curCat){
    const catSvc = p.svc[curCat.name];
    if(catSvc && catSvc.sub){
      if(catSvc.sub.includes(sub)) return true;
      const subParts = sub.replace(/以及/g,"以及,").split(/[,、，]\s*/);
      const svcParts = catSvc.sub.split(/[,、，]\s*/);
      for(const sp of subParts){
        if(sp && svcParts.some(sv=>sv.includes(sp))) return true;
      }
    }
  }
  // Fallback: check all svc keys if no curCat
  if(p.svc && !curCat){
    for(const key in p.svc){
      if(p.svc[key].sub){
        if(p.svc[key].sub.includes(sub)) return true;
      }
    }
  }
  // Check tags
  if(p.tags.includes(sub)) return true;
  return false;
}

function providersForCat(cat){
  return providers.filter(p=>matchSite(p)&&providerMatchesCat(p,cat));
}

    for(const cat of svcKeys){
      const d=p.svc[cat];
      const flagMap={"北美站":"flags/US.png","歐洲站":"flags/EU.png","日本站":"flags/JP.png","澳洲站":"flags/AU.png","中東站":"flags/沙烏地阿拉伯.png"};
      const flags=p.regions.map(r=>flagMap[r]?`<img src="${flagMap[r]}" alt="${r}" title="${r}" style="height:16px;vertical-align:middle;cursor:help;">`:"").filter(Boolean).join(" ");
      const catIcon=icon(cat);
      svcHTML+=`<div class="col-12 col-md-6"><div class="svc-section h-100">
        <div class="svc-header">
          <div class="svc-header-icon"><i class="bi ${catIcon}"></i></div>
          <div class="svc-header-title">${esc(cat)}</div>
        </div>
        <div class="svc-body">
          ${d.sub?`<div class="svc-tier2"><span style="color:var(--text-secondary);font-weight:400;font-size:.84rem">提供的服務：</span>${esc(d.sub)}</div>`:""}
          ${d.desc?`<div class="svc-desc">${fmt(d.desc)}</div>`:""}
          <div class="svc-flags">${flags}</div>
        </div>
      </div></div>`;
    }
    svcHTML+=`</div>`;
  }

  const spnIntro=p.isSpn?`
    <div class="spn-intro" style="flex-direction:column;align-items:flex-start;gap:.6rem;">
      <a href="${SPN_URL}" target="_blank" rel="noopener" title="前往 Amazon Service Provider Network 頁面"><img src="spn-logo-text.png" alt="Amazon Service Provider Network" style="width:238px;height:auto;margin-top:0;"></a>
      <div class="spn-intro-text">Amazon Service Provider Network（SPN）是一群經過 Amazon 審核的第三方服務商，能協助賣家處理從產品攝影到廣告優化等各種營運需求。簡單來說，SPN 讓賣家能專注於核心業務，將專業事務交給可信賴的專家協助達成目標。</div>
    </div>`:"";

  $("spDetail").innerHTML=`
    <div class="detail-card${isHL?" sp-highlighted":""}">
      <div class="d-flex align-items-start gap-3 mb-3">
        ${logoHTML(p, 72)}
        <div>
          <h3 class="mb-0" style="font-size:1.25rem">${esc(p.name)}${hlBadge}${p.isSpn?spnBadge(28):""}${p.isAdsPartner?adsBadge(p,50):""}${tagAwards.length?tagAwards.map(awardTag).join(""):""}</h3>
          <div style="color:var(--amz-orange);font-size:.85rem">${p.regions.map(r=>esc(r)).join(" · ")} ${p.regions.map(r=>({"北美站":"flags/US.png","歐洲站":"flags/EU.png","日本站":"flags/JP.png","澳洲站":"flags/AU.png","中東站":"flags/沙烏地阿拉伯.png"})[r]?`<img src="${({"北美站":"flags/US.png","歐洲站":"flags/EU.png","日本站":"flags/JP.png","澳洲站":"flags/AU.png","中東站":"flags/沙烏地阿拉伯.png"})[r]}" title="${esc(r)}" style="height:14px;vertical-align:middle;margin-left:2px;cursor:help;">`:"").filter(Boolean).join("")}</div>
          <div style="font-size:.82rem;color:var(--text-light);margin-top:.3rem">提供的服務：${esc(p.tags.join("、"))}</div>
        </div>
      </div>
      ${awardNotesHTML(p)}
      ${p.intro?`<p class="mb-2" style="font-size:.88rem;color:var(--text-secondary);line-height:1.6">${fmt(p.intro)}</p>`:""}
      <hr>
      <h5><i class="bi bi-person-lines-fill me-2"></i>聯絡資訊</h5>
      <div class="d-flex align-items-start gap-4">
        <div class="flex-grow-1">
          ${(()=>{const v=cleanContact(p.contact);return v?`<p class="mb-1"><i class="bi bi-person me-2"></i>${esc(v)}</p>`:"";})()}
          ${(()=>{const v=cleanContact(p.phone);return v?`<p class="mb-1"><i class="bi bi-telephone me-2"></i>${esc(v)}</p>`:"";})()}
          ${(()=>{const v=cleanContact(p.email);return v?`<p class="mb-1"><i class="bi bi-envelope me-2"></i><a href="mailto:${encodeURIComponent(v)}" style="color:inherit;text-decoration:underline;">${esc(v)}</a></p>`:"";})()}
          ${(()=>{const v=cleanContact(p.lineId);return v?`<p class="mb-1"><i class="bi bi-chat-dots me-2"></i>${esc(v)}</p>`:"";})()}
          ${websiteLink(p.website)}
        </div>
        ${p.qrFile?`<div class="text-center"><img src="QRcode/${encodeURIComponent(p.qrFile)}" alt="QR Code" style="width:120px;height:120px;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--border);"><div style="font-size:.7rem;color:var(--text-light);margin-top:.3rem">掃碼聯繫</div></div>`:p.qrId?`<div class="text-center"><img src="https://drive.google.com/thumbnail?id=${encodeURIComponent(p.qrId)}&sz=w240" alt="QR Code" style="width:120px;height:120px;object-fit:contain;border-radius:var(--radius-sm);border:1px solid var(--border);"><div style="font-size:.7rem;color:var(--text-light);margin-top:.3rem">掃碼聯繫</div></div>`:""}
      </div>
      ${p.routes?renderRoutes(p):""}
      ${spnIntro}
      ${svcHTML}
      <div class="mt-4"><button class="btn btn-outline-secondary" style="font-size:1rem;padding:.5rem 1.2rem;font-weight:600;" onclick="goBackOrL2()"><i class="bi bi-arrow-left-circle-fill me-2" style="font-size:1.2rem;"></i>返回列表</button></div>
    </div>`;

  // GA4 contact_click — delegated listener, replaced on each openDetail call so
  // provider_name is always the current provider (captured in closure via `name`/`p`).
  const detailEl = $("spDetail");
  if(detailEl._contactClickHandler) detailEl.removeEventListener("click", detailEl._contactClickHandler);
  detailEl._contactClickHandler = function(e){
    const a = e.target.closest("a[href]");
    if(!a) return;
    const href = a.getAttribute("href");
    if(href === SUMMIT_AWARD_POST) return; // award tag -> tracked as promo_click, not a contact
    let method;
    if(href.startsWith("mailto:")) method = "email";
    else if(p.adsLink && href === p.adsLink) method = "ads";
    else if(href.startsWith(SPN_URL.slice(0,40))) method = "spn";
    else if(href.startsWith("http")) method = "website";
    if(!method) return;
    gtag("event", "contact_click", {
      provider_name: name,
      method: method,
      tier1_domain: curCat ? curCat.name : "",
      site: curSite || "all"
    });
  };
  detailEl.addEventListener("click", detailEl._contactClickHandler);
}

/* ===== Search ===== */
/* Synonym normalization — collapse common 繁簡 / 陸台 / 口語 variants so a query
   matches regardless of which wording a provider used. Applied to BOTH the query
   and the haystack, so the two meet on a shared canonical token. Order matters:
   longer / more-specific patterns first (e.g. 北美站 before 北美). Each pattern is
   a plain substring match on an already-lowercased string. */
const SEARCH_SYNONYMS=[
  ["代運營","代營運"],["運營","營運"],                                   // 陸 → 台 用語
  ["北美站","美國"],["北美","美國"],                                     // 站點名 ↔ routes 口語國名
  ["歐洲站","歐洲"],["日本站","日本"],["澳洲站","澳洲"],
  ["中東站","中東"],["沙烏地阿拉伯","中東"],["沙烏地","中東"],["阿聯酋","中東"],["杜拜","中東"],
  ["金流","收款"],["網紅","kol"],                                       // 服務口語別名
  ["lingxing","領星"]                                                   // 品牌英文名 → 中文名 (領星ERP)
];
function normSearch(s){
  s=(s||"").toLowerCase();
  for(const [from,to] of SEARCH_SYNONYMS) s=s.split(from).join(to);
  return s;
}
function runSearch(){
  const raw=$("searchInput").value.trim();
  if(!raw){ goHome(); return; }
  const q=normSearch(raw);
  curCat=null; curSub=null;
  $("subTypeNav").innerHTML="";
  showL2(); renderDomainBar();
  const list=providers.filter(p=>{
    if(!matchSite(p)) return false;
    // Mirror the browse-by-category matcher: include the precise sub-type labels
    // (svc[].sub — the "提供的服務" line on each card), the site list, and the
    // logistics routes (destination countries + transport modes). Without these
    // a query like "代營運" or "沙烏地阿拉伯" missed providers whose cards clearly show them.
    const haystack=normSearch([
      p.name,
      p.tags.join(" "),
      p.intro||"",
      p.regions.join(" "),
      Object.keys(p.svc||{}).join(" "),
      Object.values(p.svc||{}).map(s=>(s.sub||"")+" "+(s.desc||"")).join(" "),
      p.routes?Object.entries(p.routes).map(([c,m])=>c+" "+m).join(" "):""
    ].join(" "));
    return haystack.includes(q);
  });
  renderSPList(list);
  // Log search to GA4 so we can see what sellers actually type, and which queries
  // return zero results — those are the prime candidates for new SEARCH_SYNONYMS
  // entries. search_term = raw input as typed; normalized_term = post-synonym form
  // (lets us tell whether a synonym mapping fired); result_count drives the
  // "high-frequency but zero-result" report.
  gtag('event','search',{
    search_term: raw,
    normalized_term: q,
    result_count: list.length,
    site: curSite||'all'
  });
  pushNav({view:"search",q:raw});
}

/* ===== Site change ===== */
function setSite(s){
  curSite=s||null;
  if(level2.style.display==="block"){
    if(curCat){
      // If current sub-type is no longer allowed for the new site, reset
      if(curSub && !subAllowedForSite(curSub)) curSub=null;
      renderSubNav();
      if(curSub) renderSPList(providers.filter(p=>matchSite(p)&&providerMatchesSub(p,curSub)));
      else renderSPList(providersForCat(curCat));
    } else { runSearch(); }
  }
}

/* ===== Hierarchy Data loaded from prov_data.js ===== */
</script>

<script src="prov_data.js"></script>
<script src="pmm_news.js" onerror="window.PMM_NEWS=[]"></script>
<script>
/* ===== Boot ===== */
function boot(){
  HIER.forEach(r=>{
    const d=r[0], s=r.slice(1).filter(Boolean);
    categories.push({name:d,subTypes:s});
  });
  categories.forEach(c=>categoryMap[c.name]=c);

  providers=PROV.map(r=>({
    name:r.n, contact:r.c||"", phone:r.p||"", email:r.e||"",
    lineId:r.l||"", intro:r.intro||"", tags:r.t||[], svc:r.svc||{},
    regions:r.r||[], website:r.w||"", score:r.score||0,
    logoId:r.logoId||"", qrId:r.qrId||"", routes:r.routes||null,
    awards:r.awards||[], awardNotes:r.awardNotes||{}, logoFile:r.logoFile||"", qrFile:r.qrFile||"",
    isSpn:r.isSpn||false,
    isAdsPartner:r.isAdsPartner||false, adsLink:r.adsLink||""
  }));
  // Sort order for every provider list (browse-by-domain + search):
  // 1) any-badge providers first — a "badge" is any award, SPN membership, or
  //    Ads-partner status. Badged SSPs surface above non-badged ones.
  // 2) then SEND carriers, 3) then by score desc.
  const hasBadge=p=>(p.awards.length>0||p.isSpn||p.isAdsPartner)?1:0;
  providers.sort((a,b)=>{
    const aB=hasBadge(a), bB=hasBadge(b);
    if(bB!==aB) return bB-aB;
    const aS=a.awards.some(aw=>aw.includes("SEND"))?1:0;
    const bS=b.awards.some(aw=>aw.includes("SEND"))?1:0;
    if(bS!==aS) return bS-aS;
    return b.score-a.score;
  });
  providers.forEach(p=>providerMap[p.name]=p);

  renderL1();
  renderAwardSlide();
  renderNews();
  $("searchForm").addEventListener("submit",e=>{ e.preventDefault(); runSearch(); });
  const sel=$("siteSelect");
  sel.addEventListener("change",()=>{ curSite=sel.value; setSite(curSite); });
  curSite=sel.value;

  // Wire browser back/forward + deep-link / refresh restore
  window.addEventListener("popstate",e=>{ renderState(e.state||parseHash()); });
  const initial=parseHash();
  history.replaceState({...initial,depth:0},"",stateHash(initial));
  renderState(initial);
}
document.addEventListener("DOMContentLoaded",boot);
</script>
